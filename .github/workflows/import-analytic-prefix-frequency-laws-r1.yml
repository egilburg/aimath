name: Import analytic prefix-frequency report r1

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-analytic-prefix-frequency-laws-r1.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import filtered verified public payload
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-aab4-81fb-b9d3-ba79aeee55fe/raw?se=2026-09-10T20%3A46%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=6f87b554-930f-5903-8b8b-07d64aaf002c&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A13%3A42Z&ske=2026-09-11T03%3A13%3A42Z&sks=b&skv=2026-02-06&sig=UpF3dZaKwz%2BMBIIH//2KqiBUnB/o7ZSUtvysaeeAuWg%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/artifact.zip
          rm -rf /tmp/artifact && mkdir /tmp/artifact
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          expected=$(cut -d' ' -f1 /tmp/artifact/public-export-zip.sha256)
          actual=$(sha256sum /tmp/artifact/analytic-prefix-frequency-laws-r1-public.zip | awk '{print $1}')
          test "$expected" = "$actual"
          test ! -e analytic_prefix_frequency_laws
          unzip -q /tmp/artifact/analytic-prefix-frequency-laws-r1-public.zip -d .
          pkg=analytic_prefix_frequency_laws
          test ! -e "$pkg/evidence"
          test ! -e "$pkg/GOAL.md"
          test ! -e "$pkg/MANIFEST.json"
          test ! -d "$pkg/lean/.lake"
          cat > "$pkg/README.txt" <<'EOF'
          Analytic laws for recognizable prefix frequencies
          Machine-generated mathematical report, revision r1, 10 September 2026.

          This public package contains the reader-facing report, editable TeX and bibliography,
          a focused self-contained Lean source closure, and release verification records.

          Formal verification: Lean 4.33.1 with pinned mathlib revision
          0df444a360eaa60ab8c11dca51a86af692955474. See verification/RELEASE_VERIFICATION.txt,
          verification/CLAIM_MAP.txt, and lean/README.txt.

          The report makes no claim of peer review, expert endorsement, or global mathematical priority.
          Repository maintainer: https://github.com/egilburg/aimath
          License: CC BY 4.0, subject to third-party notices/licenses where applicable.
          EOF
          sed -i 's/^          //' "$pkg/README.txt"
          cat > "$pkg/CORRECTIONS.txt" <<'EOF'
          Corrections for analytic_prefix_frequency_laws-r1

          Report suspected mathematical, formalization, attribution, or packaging errors at:
          https://github.com/egilburg/aimath/issues

          Please identify the affected release/version and the specific claim or file. An issue report is
          not itself a confirmed error. Corrections, if required, will use a new forward commit/version;
          this archived r1 snapshot remains historically identifiable.
          EOF
          sed -i 's/^          //' "$pkg/CORRECTIONS.txt"
          cat > "$pkg/PUBLICATION.json" <<'EOF'
          {
            "schema_version": 1,
            "publication_id": "analytic_prefix_frequency_laws",
            "document_type": "machine-generated mathematical report",
            "title": "Analytic laws for recognizable prefix frequencies",
            "version": "r1",
            "date": "2026-09-10",
            "license": "CC-BY-4.0",
            "repository_maintainer": "https://github.com/egilburg/aimath",
            "formal_source": "73edf1d96438cde89dbac16c70106003b35d2f06",
            "formal_receipt": "cfdc9de0f7d6ea8a08530027c814db959d68c850",
            "mathematical_source": "7e21b43e34aa0bedc79b4e46b72bcc182cf9a653",
            "review_status": "not_peer_reviewed",
            "priority_status": "global_priority_not_claimed",
            "corrections": "https://github.com/egilburg/aimath/issues"
          }
          EOF
          sed -i 's/^          //' "$pkg/PUBLICATION.json"
          (cd "$pkg" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          if ! grep -q 'analytic_prefix_frequency_laws' RELEASES.txt; then
            printf '\nanalytic_prefix_frequency_laws-r1 | 2026-09-10 | Analytic laws for recognizable prefix frequencies | machine-generated mathematical report | Lean-verified release package\n' >> RELEASES.txt
          fi
          if ! grep -q 'analytic_prefix_frequency_laws' README.txt; then
            printf '\n- analytic_prefix_frequency_laws/ — Analytic laws for recognizable prefix frequencies (r1)\n' >> README.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$pkg" README.txt RELEASES.txt
          git commit -m "Publicly release analytic prefix-frequency report r1"
          git tag -a analytic_prefix_frequency_laws-r1 -m "Analytic laws for recognizable prefix frequencies r1"
          git push origin HEAD:main
          git push origin refs/tags/analytic_prefix_frequency_laws-r1
