name: Inspect report-format PDFs

on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-report-format-pdfs.yml]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/report-format-r2-r4-r3
      - name: Render first pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p renders
          pdftoppm -f 1 -singlefile -png -r 150 analytic_prefix_frequency_laws/analytic_laws_for_recognizable_prefix_frequencies.pdf renders/analytic
          pdftoppm -f 1 -singlefile -png -r 150 mortality/exponential_mortality_bound_for_finite_real_matrix_monoids.pdf renders/mortality
          pdftoppm -f 1 -singlefile -png -r 150 sofic_markov_order/sharp_finite_markov_order_in_intrinsic_sofic_dimension.pdf renders/sofic
      - uses: actions/upload-artifact@v4
        with:
          name: report-format-first-pages
          path: renders/*.png
          if-no-files-found: error
